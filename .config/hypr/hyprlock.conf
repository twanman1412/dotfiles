# Rosé Pine Hyprlock Configuration

$font = CaskaydiaCove Nerd Font

# --- Rosé Pine Color Tokens ---
$base           = rgba(191724ee)
$base_solid     = rgb(191724)
$surface        = rgba(1f1d2eee)
$overlay        = rgba(26233aee)
$muted          = rgba(6e6a86aa)
$subtle         = rgb(908caa)
$text           = rgb(e0def4)
$love           = rgb(eb6f92)
$gold           = rgb(f6c177)
$rose           = rgb(ebbcba)
$pine           = rgb(31748f)
$foam           = rgb(9ccfd8)
$iris           = rgb(c4a7e7)

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 3, easeOutQuint
    animation = fadeOut, 1, 2, easeOutQuint
    animation = inputFieldDots, 1, 1.5, easeOutQuint
}

# Frosted background from current screen
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.015
    contrast = 0.8916
    brightness = 0.75
    color = $base_solid
}

# Password Input Field
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    
    # Sharp, deliberate corners matching the desktop shell
    rounding = 4

    # Translucent surface fill
    inner_color = rgba(31, 29, 46, 0.65)
    
    # Border states: Rose/Iris gradient on neutral, Gold on check, Love on fail
    outer_color = rgba(235, 188, 186, 0.6) rgba(196, 167, 231, 0.6) 45deg
    check_color = $gold $rose 45deg
    fail_color = $love $gold 40deg

    font_color = $text
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##6e6a86">Input Password...</span>
    fail_text = <span foreground="##eb6f92">$FAIL ($ATTEMPTS)</span>

    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    position = 0, -40
    halign = center
    valign = center
}

# TIME (Large Clock)
label {
    monitor =
    text = $TIME
    color = $iris
    font_size = 86
    font_family = $font
    font_weight = bold

    position = 0, -18%
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $subtle
    font_size = 18
    font_family = $font

    position = 0, -31%
    halign = center
    valign = top
}

# USER STATUS BADGE
label {
    monitor =
    text = 󰌾  Logged in as <span foreground="##ebbcba"><b>$USER</b></span>
    color = $subtle
    font_size = 12
    font_family = $font

    position = 0, 30
    halign = center
    valign = bottom
}
